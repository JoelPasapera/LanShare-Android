# Compila el APK en GitHub a cada push: sin Android Studio en tu PC.
# Descárgalo desde la pestaña Actions → la ejecución → Artifacts.
name: APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Pruebas del núcleo y APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:check :app:assembleRelease :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: LanShare-Android-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
